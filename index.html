<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eJagruti | Welcome</title>
  <link rel="stylesheet" href="styles.css">
  <script src="js/auth.js" defer></script>
  <script src="js/script.js" defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="welcome-page">
    <span class="logo-frame welcome-logo">
      <img src="images/shree_yantra.jpg" alt="Shree Yantra — eJagruti logo">
    </span>
    <h1>Welcome to eJagruti</h1>
    <p>Awaken ideas. Build intelligence.</p>
    <p>Sign in with your approved Gmail account to continue.</p>
    <div id="g_id_onload"
         data-client_id="55241675267-vh1gcsn07uq3cbeir7vj57l58h0h2c0d.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false"
         data-auto_select="false"></div>
    <div class="g_id_signin" data-type="standard" data-size="large"></div>
    <p id="login-status" role="status" aria-live="polite"></p>
    <noscript><p>Enable JavaScript to sign in with Google.</p></noscript>
  </main>
</body>
</html>
